[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kredent"
version = "1.0.0"
description = "Identity and verifiable reputation for autonomous agents — W3C did:key, Ed25519 signed attestations, offline verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kredent Contributors" }]
keywords = ["agent", "identity", "did", "did:key", "reputation", "attestation", "ed25519", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # Ed25519 via the audited, compiled pyca/cryptography. This is the ONLY
    # runtime dependency, and it is optional in practice: the package ships a
    # pure-Python Ed25519 implementation that is used automatically when this
    # library is absent, so verification works with zero dependencies.
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
mcp = [
    # Only needed to run the MCP server. The core library does not import it.
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
kredent = "kredent.cli:main"
kredent-mcp = "kredent.mcp_server:main"

[tool.setuptools]
packages = ["kredent"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["kredent"]
omit = ["*/__pycache__/*"]
